[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueban813"
version = "0.2.0"
description = "BLUEBAN 813: closed-loop coastal incident intelligence for the UAE (Team Kanban, Arab Youth Space Hackathon 2026, 813 Challenge)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team Kanban" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "affine>=2.4",
  "h5py>=3.10",
  "h5netcdf>=1.3",
  "xarray>=2024.1",
  "fsspec>=2024.2",
  "pystac-client>=0.7",
  "planetary-computer>=1.0",
  "requests>=2.31",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
inland = ["pandas>=2.0"]   # pipeline/inland/temporal.py (not needed to serve the precomputed results)

[tool.setuptools]
packages = ["pipeline", "services", "services.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
