name: Publish research paper

# GitHub Pages serves paper/ (built from the pipeline outputs by
# scripts/build_paper.py). The github-pages environment only accepts the
# default branch, so this runs on main.
on:
  push:
    branches: [main]
    paths: ["paper/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: paper
      - id: deployment
        uses: actions/deploy-pages@v4
